<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f1">
  <meta name="description" content="星泊，給自閉症（ASD）孩子照顧者的生活支持手冊。">
  <title>星泊 · ASD 育兒支持手冊</title>
  <link rel="stylesheet" href="styles.css?v=0fe9554e">
  <script src="guide.js?v=ad42c78d" defer></script>
  <script src="app.js?v=385512d8" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要內容</a>
  <div id="app"></div>
  <div id="notice" class="notice" role="status"></div>
  <dialog id="reset-dialog" aria-labelledby="reset-title">
    <h2 id="reset-title">清除本機資料？</h2>
    <p>這個瀏覽器裡的孩子資料、偏好、收藏和筆記都會移除。</p>
    <div class="dialog-actions">
      <form method="dialog"><button class="button secondary" autofocus>取消</button></form>
      <button class="button danger" data-action="reset">清除資料</button>
    </div>
  </dialog>
  <noscript>請開啟 JavaScript 以操作星泊原型。</noscript>
</body>
</html>
